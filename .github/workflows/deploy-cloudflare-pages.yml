# Deploys the React UI (frontend/) to Cloudflare Pages on every push to main, or by hand from the Actions tab.
# The API itself runs elsewhere (the Hugging Face Space); the UI only calls it.
# Needs two repository secrets (Settings -> Secrets and variables -> Actions):
#   CLOUDFLARE_API_TOKEN   a Cloudflare API token with "Cloudflare Pages: Edit"
#   CLOUDFLARE_ACCOUNT_ID  your Cloudflare account id (dashboard sidebar)
# Optional repository variables:
#   CF_PAGES_PROJECT  Pages project name (default: mijhar -> https://mijhar.pages.dev)
#   VITE_API_URL      the API base URL (default: https://xy4z-mijhar.hf.space)
name: Deploy UI to Cloudflare Pages

on:
  push:
    branches: [main]
    paths: ["frontend/**", ".github/workflows/deploy-cloudflare-pages.yml"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      PROJECT: ${{ vars.CF_PAGES_PROJECT || 'mijhar' }}
    steps:
      - uses: actions/checkout@v4
      - name: Skip when Cloudflare secrets are not set
        id: guard
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CF_TOKEN" ] || [ -z "$CF_ACCOUNT" ]; then echo "Cloudflare secrets not set; skipping deploy."; echo "go=false" >> "$GITHUB_OUTPUT"; else echo "go=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v4
        if: steps.guard.outputs.go == 'true'
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build
        if: steps.guard.outputs.go == 'true'
        working-directory: frontend
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL || 'https://xy4z-mijhar.hf.space' }}
        run: |
          npm ci
          npm run build
          echo "/* /index.html 200" > dist/_redirects
      - name: Create the Pages project if missing
        if: steps.guard.outputs.go == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@3.114.0 pages project create "$PROJECT" --production-branch main || true
      - name: Deploy
        if: steps.guard.outputs.go == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@3.114.0 pages deploy frontend/dist --project-name "$PROJECT" --branch main --commit-dirty=true
          echo "UI: https://$PROJECT.pages.dev"
