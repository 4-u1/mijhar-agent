<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="MIJHAR">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#138A70"/>
      <stop offset="1" stop-color="#0A4A3D"/>
    </linearGradient>
    <clipPath id="lens"><circle cx="27" cy="27" r="14.5"/></clipPath>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#bg)"/>
  <!-- the document under the lens: plain lines, one claim flagged -->
  <g clip-path="url(#lens)">
    <rect x="10" y="10" width="34" height="34" fill="#F3F5F2" opacity=".14"/>
    <rect x="15" y="18" width="22" height="3" rx="1.5" fill="#F3F5F2"/>
    <rect x="15" y="25.5" width="14" height="3" rx="1.5" fill="#E3B341"/>
    <circle cx="33.5" cy="27" r="2.2" fill="#E3B341"/>
    <rect x="15" y="33" width="19" height="3" rx="1.5" fill="#F3F5F2"/>
  </g>
  <circle cx="27" cy="27" r="14.5" fill="none" stroke="#F3F5F2" stroke-width="4"/>
  <!-- handle with a seal band -->
  <path d="M38 38 L51 51" stroke="#F3F5F2" stroke-width="7" stroke-linecap="round"/>
  <path d="M41.2 41.2 L44.2 44.2" stroke="#E3B341" stroke-width="7.4" stroke-linecap="butt"/>
</svg>
